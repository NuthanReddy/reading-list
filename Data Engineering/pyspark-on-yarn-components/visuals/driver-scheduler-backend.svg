<title id="topo-title">CoarseGrainedSchedulerBackend: Executor Ledger</title>
<desc id="topo-desc">RegisterExecutor (free=0) vs LaunchedExecutor (free=2), ordered locks, LaunchTask size guard, and slot return. 1. ExecutorBackend to DriverSchedBackend: RegisterExecutor(3,2cpu) (driver-1:41000); 2. DriverSchedBackend to LiveListenerBus: ExecutorAdded (exec-3) (driver-1 in-JVM); 3. ExecutorBackend to DriverSchedBackend: LaunchedExecutor(3) (driver-1:41000); 4. DriverSchedBackend to TaskSchedulerImpl: resourceOffers(3:free=2) (driver-1 in-JVM); 5. DriverSchedBackend to ExecutorBackend: LaunchTask (TID 41) (driver-1:41000); 6. ExecutorBackend to DriverSchedBackend: StatusUpdate(41,FINISHED) (driver-1:41000)</desc>
