<title id="topo-title">YARN Container: Allocation Record to Spark Slots</title>
<desc id="topo-desc">Grant token != running process; one container hosts two reusable Spark slots. 1. ResourceManager to YarnAllocator: Grant container_0005 (rm01:8030); 2. YarnAllocator to NodeManager: StartContainerRequest (worker-b:45454); 3. NodeManager to YARN Container: Spawn process tree (worker-b OS); 4. YARN Container to ExecutorBackend: Start Executor JVM (3) (worker-b proc); 5. ExecutorBackend to DriverSchedBackend: RegisterExecutor (2 slot) (driver-1:41000); 6. YARN Container to NodeManager: Container COMPLETE (0) (worker-b OS)</desc>
