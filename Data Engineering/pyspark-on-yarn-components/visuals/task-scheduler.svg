<title id="topo-title">TaskSchedulerImpl: Pool Order &amp; Offer Matching</title>
<desc id="topo-desc">FIFO/FAIR Schedulable pools, per-round BigDecimal CPU debit, TID routing, and off-lock result fetching. 1. DAGScheduler to TaskSchedulerImpl: submitTasks(TaskSet 1.0) (driver-1 in-JVM); 2. DriverSchedBackend to TaskSchedulerImpl: resourceOffers(exec3:2c) (driver-1 in-JVM); 3. TaskSchedulerImpl to TaskSetManager: resourceOffer(exec3,LOC) (driver-1 in-JVM); 4. TaskSchedulerImpl to DriverSchedBackend: TaskDescriptions [TID 41] (driver-1 in-JVM); 5. ExecutorBackend to DriverSchedBackend: StatusUpdate(41,FINISHED) (driver-1:41000); 6. TaskSchedulerImpl to TaskResultGetter: enqueueSuccessfulTask(41) (driver-1 in-JVM)</desc>
