<title id="topo-title">HeartbeatReceiver — Executor Liveness &amp; Metrics</title>
<desc id="topo-desc">Driver receipt-clock liveness checks, in-flight metrics forwarding, and 180s timeout expiry. 1. Executor to HeartbeatReceiver: Heartbeat(exec=7) (:41000); 2. HeartbeatReceiver to TaskSchedulerImpl: executorHeartbeatReceived (in-JVM); 3. DAGScheduler to BlockManagerMaster: BlockManagerHeartbeat (:41000); 4. HeartbeatReceiver to Executor: HeartbeatResponse(false) (:41000); 5. HeartbeatReceiver to HeartbeatReceiver: ExpireDeadHosts (180s) (in-JVM); 6. HeartbeatReceiver to DriverSchedBackend: RemoveExecutor(7,timeout) (:41000)</desc>
