<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="topo-title" aria-describedby="topo-desc">
<title id="topo-title">BasePythonRunner — Non-Blocking NIO Socket Exchange</title>
<desc id="topo-desc">Executor-side compute() -&gt; InterruptibleIterator, NIO Selector duplex I/O, and CAS worker release. 1. Task Attempt to BasePythonRunner: compute(iter, split=7) (in-JVM); 2. BasePythonRunner to PythonWorkerFactory: Acquire worker + monitor (in-JVM); 3. Exec BroadcastMgr to BasePythonRunner: Diff broadcast_9_python (in-JVM); 4. BasePythonRunner to Python Worker: INIT + input + END_STREAM (127.0.0.1:ephemeral); 5. Python Worker to BasePythonRunner: Frames + accums + reply (127.0.0.1:ephemeral); 6. BasePythonRunner to PythonWorkerFactory: Release once (CAS=true) (in-JVM)</desc>
<defs>
  <pattern id="bp-grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="0.9" fill="#1a253b"/>
  </pattern>
</defs>
