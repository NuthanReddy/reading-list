<title id="topo-title">SparkContext: Singleton App &amp; runJob Boundary</title>
<desc id="topo-desc">Singleton guard, ordered service wiring, closure cleaning, and atomic stop sequence. 1. SparkSession to SparkContext: new SparkContext(conf) (driver-1 in-JVM); 2. SparkContext to SparkEnv: createDriverEnv + set (driver-1:41000); 3. SparkContext to HeartbeatReceiver: Register HeartbeatRecv (driver-1:41000); 4. SparkContext to DAGScheduler: runJob(rdd, cleanFn) (driver-1 in-JVM); 5. DAGScheduler to SparkContext: resultHandler(idx, val) (driver-1 in-JVM); 6. SparkContext to LiveListenerBus: ApplicationEnd + stop() (driver-1 in-JVM)</desc>
