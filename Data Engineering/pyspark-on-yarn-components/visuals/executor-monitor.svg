<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="topo-title" aria-describedby="topo-desc">
<title id="topo-title">ExecutorMonitor: Idle Deadlines &amp; Data Holds</title>
<desc id="topo-desc">Active-shuffle exclusion, idleStart + max(30s, 120s cache, 90s shuffle) deadline, and unpersist recalculation. 1. LiveListenerBus to ExecutorMonitor: TaskEnd (exec-7, shuf S) (driver-1 in-JVM); 2. BlockManagerMaster to LiveListenerBus: BlockUpdated (rdd_12_3) (driver-1 in-JVM); 3. LiveListenerBus to ExecutorMonitor: JobEnd -&gt; deadline 120s (driver-1 in-JVM); 4. LiveListenerBus to ExecutorMonitor: UnpersistRDD -&gt; 90s cap (driver-1 in-JVM); 5. ExecutorMonitor to ExecutorAllocMgr: Candidate (exec-7, p0) (driver-1 in-JVM); 6. ExecutorAllocMgr to DriverSchedBackend: Verify idle &amp; remove 7 (driver-1 in-JVM)</desc>
