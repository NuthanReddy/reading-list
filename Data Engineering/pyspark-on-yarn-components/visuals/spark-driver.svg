<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="topo-title" aria-describedby="topo-desc">
<title id="topo-title">Spark Driver JVM: Control Plane &amp; Dispatch</title>
<desc id="topo-desc">Cluster AM vs client submit placement, AM handoff, executor registration, and task RPC. 1. Python Driver to Py4J Gateway: getOrCreate() via Py4J (127.0.0.1:43112); 2. Py4J Gateway to Spark Driver JVM: Init SparkEnv &amp; sched (driver-1 in-JVM); 3. Spark Driver JVM to ApplicationMaster: Hand off SparkContext (driver-1 in-JVM); 4. ExecutorBackend to DriverSchedBackend: Register + LaunchedExec (driver-1:41000); 5. DriverSchedBackend to ExecutorBackend: LaunchTask (TID 41) (driver-1:41000); 6. ExecutorBackend to DriverSchedBackend: StatusUpdate (FINISHED) (driver-1:41000)</desc>
