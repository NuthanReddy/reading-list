<title id="topo-title">HDFS NameNode: Namespace, Leases &amp; Block Map</title>
<desc id="topo-desc">ClientProtocol metadata RPCs, FSNamesystem allocation, and DatanodeProtocol reports. 1. Spark Driver JVM to HDFS NameNode: getListing(/warehouse) (nn01:8020); 2. Task Attempt to HDFS NameNode: getBlockLocations(4096) (nn01:8020); 3. Task Attempt to HDFS NameNode: create + addBlock (nn01:8020); 4. HDFS DataNode to HDFS NameNode: blockReceivedAndDeleted (nn01:8020); 5. Task Attempt to HDFS NameNode: complete(part-00000) (nn01:8020); 6. FileCommitProtocol to HDFS NameNode: rename(staging -&gt; final) (nn01:8020)</desc>
