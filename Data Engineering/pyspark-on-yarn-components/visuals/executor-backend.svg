<title id="topo-title">YarnCoarseGrainedExecutorBackend: Bootstrap &amp; Relay</title>
<desc id="topo-desc">Temporary driverPropsFetcher, RegisterExecutor -&gt; RegisteredExecutor -&gt; LaunchedExecutor, and StopExecutor. 1. NodeManager to ExecutorBackend: Start ExecutorBackend (worker-a proc); 2. ExecutorBackend to DriverSchedBackend: RetrieveSparkAppConfig (driver-1:41000); 3. ExecutorBackend to Exec SparkEnv: createExecutorEnv(&quot;3&quot;) (worker-a JVM); 4. ExecutorBackend to DriverSchedBackend: RegisterExecutor(id=3) (driver-1:41000); 5. ExecutorBackend to Executor: new Executor + Launched (worker-a JVM); 6. DriverSchedBackend to ExecutorBackend: LaunchTask / StopExec (driver-1:41000)</desc>
