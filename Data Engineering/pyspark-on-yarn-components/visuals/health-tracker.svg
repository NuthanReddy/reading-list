<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="topo-title" aria-describedby="topo-desc">
<title id="topo-title">HealthTracker -- ExcludeOnFailure vs YARN AM Node Tracker</title>
<desc id="topo-desc">Task/stage/app failure counting, resourceOffers gating, AM excludedNode sync, and 1h timeout expiry. 1. TaskSetManager to TaskSchedulerImpl: Failures on Exec-1 &amp; Exec-3 (driver-1 in-JVM); 2. TaskSchedulerImpl to HealthTracker: Exclude Exec-1, Exec-3 &amp; node (driver-1 in-JVM); 3. HealthTracker to LiveListenerBus: SparkListenerNodeExcluded (driver-1 in-JVM); 4. HealthTracker to YarnSchedBackend: scheduler.excludedNodes() (driver-1 in-JVM); 5. YarnSchedBackend to YarnAllocator: RequestExecutors(excluded) (driver-1 in-JVM); 6. HealthTracker to TaskSchedulerImpl: applyExcludeOnFailureTimeout (driver-1 in-JVM)</desc>
