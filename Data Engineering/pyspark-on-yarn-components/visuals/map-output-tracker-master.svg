<title id="topo-title">MapOutputTrackerMaster — Driver Shuffle Directory</title>
<desc id="topo-desc">Logical mapIndex slots, physical mapId attempt tracking, snapshot serialization, and epoch invalidation. 1. DAGScheduler to MapOutputMaster: registerShuffle(id=7) (in-JVM); 2. Task Attempt to DAGScheduler: MapStatus(slot=3,id=41) (:41000); 3. DAGScheduler to MapOutputMaster: registerMapOutput(7,3) (in-JVM); 4. MapOutputWorker to MapOutputMaster: GetMapOutputStatuses(7) (:41000); 5. MapOutputMaster to BroadcastManager: Serialize / Broadcast (in-JVM); 6. MapOutputMaster to TaskSetManager: unregister &amp; epoch++ (in-JVM)</desc>
