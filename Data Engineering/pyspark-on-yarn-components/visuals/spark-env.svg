<title id="topo-title">SparkEnv: Per-JVM Services &amp; Master Lookups</title>
<desc id="topo-desc">createDriverEnv vs createExecutorEnv, registerOrLookupEndpoint, and advertised host vs bindAddress. 1. SparkContext to Driver SparkEnv: createDriverEnv(&quot;driver&quot;) (driver-1:41000); 2. Driver SparkEnv to MapOutputMaster: Register MapOutputMaster (driver-1:41000); 3. Driver SparkEnv to BlockManagerMaster: Register BlockMgrMaster (driver-1:41000); 4. ExecutorBackend to Exec SparkEnv: createExecutorEnv(&quot;1&quot;) (worker-a JVM); 5. ExecutorBackend to MapOutputMaster: Lookup &amp; GetMapStatuses (driver-1:41000); 6. Driver SparkEnv to NettyRpcEnv: stop() -&gt; rpcEnv.shutdown (local JVM)</desc>
