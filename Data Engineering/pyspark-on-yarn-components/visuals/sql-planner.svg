<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="topo-title" aria-describedby="topo-desc">
<title id="topo-title">SparkPlanner -- Logical Plan to Prepared SparkPlan</title>
<desc id="topo-desc">JoinSelection build-side rules, first-candidate selection, EnsureRequirements, and RDD handoff. 1. SparkSession to SQL Planner: createSparkPlan(LeftJoin) (in-JVM); 2. SQL Planner to BroadcastHashJoin: Select BHJ(BuildRight) (in-JVM); 3. SQL Planner to SQL Planner: Expand PlanLater -&gt; 1st (in-JVM); 4. SQL Planner to BroadcastExchange: Insert BroadcastExchange (in-JVM); 5. SQL Planner to Adaptive Query Exec: Wrap AdaptiveSparkPlan (in-JVM); 6. BroadcastHashJoin to DAGScheduler: Submit RDD[InternalRow] (in-JVM)</desc>
