<title id="topo-title">Live SparkUI -- Driver AppStatusStore &amp; Jetty</title>
<desc id="topo-desc">Driver-hosted status store serving stage attempts and REST API without polling executors or logs. 1. SparkContext to Live Spark UI: SparkUI.bind(:4040) (:4040); 2. ApplicationMaster to ResourceManager: registerUiUrl(:4040) (:8030); 3. LiveListenerBus to Live Spark UI: appStatus: t83 fail + t84 (in-JVM); 4. HeartbeatReceiver to Live Spark UI: ExecutorMetricsUpdate (in-JVM); 5. Live Spark UI to Live Spark UI: store.write(Stage 3.0) (:4040); 6. Live Spark UI to SparkContext: GET /stages/3/0 &amp; cancel (:4040)</desc>
