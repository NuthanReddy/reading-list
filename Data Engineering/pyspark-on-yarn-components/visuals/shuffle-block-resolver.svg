<title id="topo-title">IndexShuffleBlockResolver -- _0 Index &amp; Byte Ranges</title>
<desc id="topo-desc">Mapping logical shuffle_7_41_2 to shuffle_7_41_0.index/.data offsets [40, 65) and 25 B FileSegment. 1. Shuffle Writer to ShuffleResolver: commit(s7,m41,[40,0,25]) (local-disk); 2. ShuffleResolver to BlockManager: Rename _0.index &amp; _0.data (local-disk); 3. BlockTransferSvc to BlockManager: getBlockData(7,41,2) (:42001); 4. BlockManager to ShuffleResolver: resolve(shuffle_7_41_2) (in-JVM); 5. ShuffleResolver to ShuffleResolver: Seek 16B -&gt; [40, 65) (local-disk); 6. ShuffleResolver to Shuffle Reader: Segment(off=40, len=25B) (local-disk)</desc>
