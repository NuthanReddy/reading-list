<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="topo-title" aria-describedby="topo-desc">
<title id="topo-title">MetricsSystem -- Per-JVM Dropwizard Sources, Sinks &amp; Servlets</title>
<desc id="topo-desc">Driver, Executor &amp; AM MetricsSystem bootstrap, internal Source registration, SparkUI /metrics/* mount, and stop cleanup. 1. SparkEnv to MetricsSystem: createMetricsSystem() (in-JVM); 2. DAGScheduler to MetricsSystem: registerSource(DAGSched) (in-JVM); 3. ApplicationMaster to MetricsSystem: registerSource(AMSource) (in-JVM); 4. MetricsSystem to Live Spark UI: attachHandler(/metrics/*) (driver-1:4040); 5. Executor to Exec Metrics: ExecutorSource &amp; report() (worker-a in-JVM); 6. SparkContext to MetricsSystem: report() &amp; stop() (in-JVM)</desc>
