<title id="topo-title">Dataset ExpressionEncoder &amp; In-JVM UDFs (Scala/Java/registerJavaFunction)</title>
<desc id="topo-desc">Driver ExpressionEncoder / JavaTypeInference.encoderFor &amp; UDF registration vs Executor in-JVM evaluation with ZERO Python IPC. 1. SparkSession to Driver Encoder: Encoder vs registerJavaUDF (driver-1 in-JVM); 2. Driver Encoder to SQL Planner: Plan MapElements vs ScalaUDF (driver-1 in-JVM); 3. SQL Planner to DAGScheduler: Submit JVM stage (driver-1 in-JVM); 4. DAGScheduler to Task (Exec 2): LaunchTask(JVM Op) (driver-1:41000); 5. Task (Exec 2) to Encoder / JVM UDF: Dataset.map vs UDF1.call (worker-b in-JVM); 6. Encoder / JVM UDF to Task (Exec 2): Return UnsafeRow (or err) (worker-b in-JVM)</desc>
