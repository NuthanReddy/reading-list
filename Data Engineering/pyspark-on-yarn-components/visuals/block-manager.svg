<title id="topo-title">BlockManager — Local Tiering, Locking &amp; Eviction</title>
<desc id="topo-desc">Per-JVM storage engine managing BlockInfoManager locks, MemoryStore/DiskStore fallback, and peer fetch. 1. BlockManager to Ext Shuffle Service: RegisterExecutor(:7337) (:7337); 2. BlockManager to BlockManagerMaster: RegisterBlockManager (:41000); 3. Task Attempt to BlockManager: doPut(rdd_17_3, MEM_DISK) (in-JVM); 4. BlockManager to BlockManagerMaster: UpdateBlockInfo(mem=64M) (:41000); 5. BlockManager to BlockManagerMaster: dropFromMemory -&gt; disk (:41000); 6. BlockManager to BlockTransferSvc: fetchBlockSync(peer) (:42002)</desc>
