<title id="topo-title">YARN ResourceManager: 3-Protocol Scheduling Hub</title>
<desc id="topo-desc">ClientRMService (:8032), ResourceTracker (:8031), ApplicationMasterService (:8030). 1. YARN Client to ResourceManager: submitApplication (rm01:8032); 2. NodeManager to ResourceManager: nodeHeartbeat (cap) (rm01:8031); 3. ResourceManager to NodeManager: AMLauncher startContainer (worker-a:45454); 4. ApplicationMaster to ResourceManager: registerApplicationMaster (rm01:8030); 5. YarnAllocator to ResourceManager: allocate (3x 2vcore) (rm01:8030); 6. ResourceManager to YarnAllocator: AllocateResponse (2/3) (rm01:8030)</desc>
