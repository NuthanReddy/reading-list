<title id="topo-title">ApplicationMaster: Attempt Coordination &amp; Unregister</title>
<desc id="topo-desc">Cluster-mode SparkContext rendezvous, RM registration, YarnAM endpoint, and attempt outcome. 1. NodeManager (AM) to ApplicationMaster: Start AM JVM (att 1) (driver-1 OS proc); 2. ApplicationMaster to Python Driver: runDriver -&gt; Python (driver-1 local); 3. SparkContext to ApplicationMaster: sparkContextInitialized (driver-1 in-JVM); 4. ApplicationMaster to ResourceManager: registerApplicationMaster (rm01:8030); 5. ApplicationMaster to YarnAllocator: createAllocator + poll (driver-1 in-JVM); 6. ApplicationMaster to ResourceManager: finishApplicationMaster (rm01:8030)</desc>
