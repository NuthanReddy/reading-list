<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="topo-title" aria-describedby="topo-desc">
<title id="topo-title">Py4J Gateway: Local Bridge &amp; Collect Data Socket</title>
<desc id="topo-desc">Authenticated loopback ClientServer, proxy handles, and separate SocketAuthServer streaming. 1. Spark Driver JVM to Py4J Gateway: Start Py4JServer (:0) (127.0.0.1:43112); 2. Python Driver to Py4J Gateway: Auth ClientServer attach (127.0.0.1:43112); 3. Python Driver to Py4J Gateway: _jdf.collectToPython() (127.0.0.1:43112); 4. Py4J Gateway to SparkSession: Run &amp; open data socket (driver-1 in-JVM); 5. Py4J Gateway to Python Driver: Return (43198, secret) (127.0.0.1:43112); 6. SparkContext to Python Driver: Stream pickled batches (127.0.0.1:43198)</desc>
