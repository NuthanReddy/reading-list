<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="topo-title" aria-describedby="topo-desc">
<title id="topo-title">NettyRpcEnv: Reverse Routing Over Client Socket</title>
<desc id="topo-desc">clientMode=true executors (no listen port), attached TransportClient reverse send, Inbox dispatch, and data-plane split. 1. ExecutorBackend to NettyRpcEnv: CheckExistence(CoarseGrn) (driver-1:41000); 2. NettyRpcEnv to DriverSchedBackend: Attach client ref (ephem) (driver-1:41000); 3. DriverSchedBackend to Exec RpcEnv: Send LaunchTask (reverse) (driver-1:41000); 4. Exec RpcEnv to ExecutorBackend: Dispatcher -&gt; Inbox (worker-a JVM); 5. TaskResultGetter to BlockTransferSvc: Fetch block (:42001) (worker-a:42001)</desc>
