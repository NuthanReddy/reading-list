<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="topo-title" aria-describedby="topo-desc">
<title id="topo-title">SessionCatalog &amp; CatalogManager -- V1/V2 Table Resolution</title>
<desc id="topo-desc">Qualified persistent catalog lookup, SessionCatalog UnresolvedCatalogRelation vs V2 plugins, optional HiveExternalCatalog, and later file-index conversion. 1. SparkSession to SessionCatalog: Init CatalogManager + V1/V2 (driver-1 in-JVM); 2. SQL Planner to SessionCatalog: loadTable(3-part V1) (driver-1 in-JVM); 3. SessionCatalog to SessionCatalog: getRelation -&gt; UnresolvedCatRel (driver-1 in-JVM); 4. SessionCatalog to SQL Planner: UnresolvedCatalogRelation (driver-1 in-JVM); 5. SQL Planner to HDFS NameNode: listStatus(orders partitions) (nn01:8020); 6. HDFS NameNode to SQL Planner: 24 Parquet LocatedFileStatus (nn01:8020); 7. SQL Planner to SQL Planner: LogicalRelation(HadoopFs) (driver-1 in-JVM)</desc>
