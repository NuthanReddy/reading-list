<title id="topo-title">SparkSession: SessionState vs SharedState</title>
<desc id="topo-desc">SQLConf/temp-view isolation across newSession(), lazy SELECT vs eager DDL, and shared stop(). 1. Python Driver to Py4J Gateway: builder.getOrCreate() (127.0.0.1:43112); 2. Py4J Gateway to SparkSession: sql(query, {:floor=10}) (driver-1 in-JVM); 3. SparkSession to SQL Planner: QueryExecution.executed (driver-1 in-JVM); 4. SQL Planner to SparkContext: SparkPlan -&gt; runJob() (driver-1 in-JVM); 5. SparkSession to SparkContext: stop() -&gt; sc.stop() (driver-1 in-JVM)</desc>
