<title id="topo-title">FileFormatWriter -- V1 Partitioned Parquet Write</title>
<desc id="topo-desc">Schema validation, WriteJobDescription, maxRecordsPerFile=2 rollover (3 files), and WriteTaskResult. 1. SparkSession to FileFormatWriter: FileFormatWriter.write() (in-JVM); 2. FileFormatWriter to Driver Commit: setupJob(stagingPath) (in-JVM); 3. FileFormatWriter to DAGScheduler: Submit WriteJobDesc (in-JVM); 4. Task Attempt to HDFS DataNode: Write 2 east + 1 west (:9866); 5. Task Attempt to FileFormatWriter: WriteTaskResult (summary) (:41000); 6. FileFormatWriter to Driver Commit: commitJob(taskMsgs) (in-JVM)</desc>
