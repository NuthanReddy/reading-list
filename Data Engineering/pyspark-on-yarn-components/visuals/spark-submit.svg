<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="topo-title" aria-describedby="topo-desc">
<title id="topo-title">spark-submit: CLI &amp; Deploy-Mode Dispatch</title>
<desc id="topo-desc">Option parsing, YARN conf mapping, and cluster vs client entry-point selection. 1. spark-submit to YARN Client: YarnClusterApplication (edge-01 in-JVM); 2. YARN Client to ApplicationMaster: Launch AM (cluster) (rm01:8032 -&gt; NM); 3. ApplicationMaster to AM PyDriver: PythonRunner.main (AM container local); 4. spark-submit to Client PyDriver: PythonRunner (client) (edge-01 local); 5. Client PyDriver to YarnClientSched: Submit AM w/ driver (edge-01:41000)</desc>
