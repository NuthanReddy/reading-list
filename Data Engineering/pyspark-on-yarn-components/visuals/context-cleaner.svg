<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="topo-title" aria-describedby="topo-desc">
<title id="topo-title">ContextCleaner -- Async WeakReference GC Cleanup</title>
<desc id="topo-desc">Driver ReferenceQueue daemon cleaning unreachable RDDs, shuffles, and broadcasts asynchronously after GC. 1. SparkContext to ContextCleaner: registerRDD/Shuffle/Broadcast (driver-1 in-JVM); 2. ContextCleaner to ContextCleaner: GC enqueue -&gt; pop task (driver-1 in-JVM); 3. ContextCleaner to BlockManagerMaster: doCleanupRDD(17) (driver-1 in-JVM); 4. ContextCleaner to MapOutputMaster: doCleanupShuffle(4) (driver-1 in-JVM); 5. ContextCleaner to BroadcastManager: doCleanupBroadcast(9) (driver-1 in-JVM); 6. BlockManagerMaster to BlockManager: RemoveRdd/Shuffle/Broadcast (driver-1:41000 (exec outbound RPC))</desc>
<defs>
  <pattern id="bp-grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="0.9" fill="#1a253b"/>
  </pattern>
</defs>
