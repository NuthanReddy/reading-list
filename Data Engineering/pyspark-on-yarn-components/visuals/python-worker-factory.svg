<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="topo-title" aria-describedby="topo-desc">
<title id="topo-title">PythonWorkerFactory — Daemon Fork &amp; Idle Pool Reuse</title>
<desc id="topo-desc">Executor-local pyspark.daemon spawn, child fork + PID/secret handshake, and FIFO idle worker checkout. 1. BasePythonRunner to Exec SparkEnv: createPythonWorker(env) (in-JVM); 2. PythonWorkerFactory to YARN Container: Spawn pyspark.daemon (in-JVM); 3. YARN Container to PythonWorkerFactory: Advertise port :53412 (127.0.0.1:ephemeral); 4. PythonWorkerFactory to Python Worker: Connect, fork &amp; PID auth (127.0.0.1:ephemeral); 5. PythonWorkerFactory to BasePythonRunner: Hand off PythonWorker (in-JVM); 6. BasePythonRunner to PythonWorkerFactory: releaseWorker -&gt; p8 hit (in-JVM)</desc>
