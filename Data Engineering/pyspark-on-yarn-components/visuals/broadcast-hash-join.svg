<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="topo-title" aria-describedby="topo-desc">
<title id="topo-title">BroadcastHashJoinExec — Per-Partition Probe &amp; Residuals</title>
<desc id="topo-desc">Shared asReadOnlyCopy() hash table, multi-match probing, residual predicate filtering, and NULL padding. 1. BroadcastExchange to BroadcastHashJoin: Broadcast[HashedRelation] (driver-1 -&gt; worker-a); 2. Task Attempt to Exec BroadcastMgr: Resolve HashedRelation (in-JVM); 3. Exec BroadcastMgr to BroadcastHashJoin: Shared backing hash map (in-JVM); 4. BroadcastHashJoin to BroadcastHashJoin: Probe k=7 -&gt; 2 matches (in-JVM); 5. BroadcastHashJoin to BroadcastHashJoin: Miss/Residual -&gt; NULL row (in-JVM); 6. BroadcastHashJoin to FileFormatWriter: Emit joined InternalRows (in-JVM)</desc>
