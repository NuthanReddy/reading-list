<title id="topo-title">YARN Submission Client: Staging &amp; Launch Spec</title>
<desc id="topo-desc">Application ID creation, resource checks, HDFS staging, and two YARN contexts. 1. spark-submit to YARN Client: new Client(args, conf) (edge-01 in-JVM); 2. YARN Client to ResourceManager: getNewApplication() (rm01:8032); 3. YARN Client to HDFS NameNode: Stage .sparkStaging/ (nn01:8020); 4. YARN Client to ResourceManager: submitApplication(ctx) (rm01:8032); 5. ResourceManager to NodeManager: Localize &amp; start AM (worker-a:45454); 6. YARN Client to ResourceManager: getApplicationReport() (rm01:8032)</desc>
