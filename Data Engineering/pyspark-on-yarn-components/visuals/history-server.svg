<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="topo-title" aria-describedby="topo-desc">
<title id="topo-title">HistoryServer -- Cold Log Replay &amp; UI Rebuild</title>
<desc id="topo-desc">Separate operator daemon (:18080) scanning HDFS logs and rebuilding driverless SparkUIs via ReplayListenerBus. 1. Spark Event Log to HDFS DataNode: Persisted eventlog_v2 (:9866); 2. History Server to HDFS NameNode: listStatus(/spark-logs) (:8020); 3. HDFS DataNode to History Server: Listing replay: AppStart (:9866); 4. History Server to HDFS NameNode: open events_1..N segments (:8020); 5. HDFS DataNode to History Server: NDJSON -&gt; ReplayBus (:9866); 6. History Server to Replayed SparkUI: Mount SparkUI(sc=None) (:18080)</desc>
